<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GX27 Event Dashboard</title>
<meta name="description" content="GX27 Festival of Connectivity — event management dashboard: tasks, finance & procurement, calendar.">
<link rel="icon" type="image/png" href="assets/globalxtreme-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="top">
      <div class="brand">
        <img class="logo" src="assets/globalxtreme-logo.png" alt="GlobalXtreme">
        <span class="name">GX<span>27</span> Operations</span>
        <span class="sub">Festival of Connectivity · 21 Nov 2026</span>
      </div>
      <button class="menu-btn" id="menuBtn" hidden aria-expanded="false" aria-controls="sideTools">Data</button>
    </div>
    <nav class="nav" id="nav" aria-label="Main">
      <button data-page="timeline"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="3.5" cy="4" r="1.5"/><circle cx="3.5" cy="12" r="1.5"/><path d="M3.5 5.5v5M7 4h7M7 12h7"/></svg>Master Timeline</button>
      <span class="sep"></span>
      <button data-page="overview"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>Overview</button>
      <button data-page="tasks"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h2M2 8h2M2 12h2M6 4h8M6 8h8M6 12h8"/></svg>Tasks<span class="count" id="navTaskCount"></span></button>
      <button data-page="finance"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="3.5" width="13" height="9" rx="1"/><path d="M1.5 6.5h13M4 10h3"/></svg>Finance &amp; Procurement</button>
      <button data-page="calendar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg>Calendar<span class="count" id="navOverdue"></span></button>
    </nav>
    <div class="countdown" id="countdown"></div>
    <div class="side-tools" id="sideTools" hidden>
      <span class="label">Data</span>
      <button data-tool="export">Export backup (JSON)</button>
      <button data-tool="import-json">Restore backup</button>
      <button data-tool="import-csv">Import budget sheet</button>
      <button data-tool="reset">Reset to initial data</button>
      <p class="side-note" id="storeNote">Saved in this browser.</p>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="data/budget-seed.js"></script>
<script src="app.js"></script>
</body>
</html>
